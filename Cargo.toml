[package]
name = "esprs"
version = "0.1.0"
authors = ["vahidtvj <vahid.tvj@gmail.com>"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[workspace]
members = [".", "crates/mqtt", "crates/power", "crates/sms", "crates/wifi"]

[[bin]]
name = "esprs"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"
[patch.crates-io]
esp-idf-sys = { git = "https://github.com/esp-rs/esp-idf-sys.git" }
esp-idf-hal = { git = "https://github.com/esp-rs/esp-idf-hal.git" }
esp-idf-svc = { git = "https://github.com/esp-rs/esp-idf-svc.git" }

[dependencies]
log = "0.4"
esp-idf-svc = "0.53"
anyhow = "1.0.104"
mqtt = { path = "crates/mqtt" }
power = { path = "crates/power" }
sms = { path = "crates/sms" }
wifi = { path = "crates/wifi" }

[build-dependencies]
dotenvy = "0.15.7"
embuild = "0.33.5"
